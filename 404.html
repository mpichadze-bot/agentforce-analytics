<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0176d3" />
    <title>Agentforce Studio - Analytics</title>
    <script>
      // Redirect to index.html for GitHub Pages SPA support
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var newPath = '/agentforce-analytics/' + (path.replace('/agentforce-analytics/', '') || 'index.html') + search + hash;
      if (path !== newPath) {
        window.location.replace(newPath);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Fallback: redirect to index.html
      setTimeout(function() {
        window.location.href = '/agentforce-analytics/index.html' + window.location.search + window.location.hash;
      }, 100);
    </script>
  </body>
</html>
