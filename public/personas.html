<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentforce Observability - Interactive Personas</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-card-hover: #22222f;
            --accent-orange: #ff6b6b;
            --accent-purple: #a855f7;
            --accent-cyan: #4ecdc4;
            --accent-yellow: #fbbf24;
            --accent-green: #51cf66;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border-color: #27272a;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 107, 107, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(78, 205, 196, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(168, 85, 247, 0.03) 0%, transparent 70%);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 10px;
        }

        .methodology-badge {
            display: inline-block;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-cyan);
            margin-top: 15px;
            font-family: 'JetBrains Mono', monospace;
        }

        .personas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .persona-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            height: 400px;
            perspective: 1000px;
        }

        .persona-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .persona-card.flipped .persona-card-inner {
            transform: rotateY(180deg);
        }

        .persona-card-front,
        .persona-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .persona-card-back {
            transform: rotateY(180deg);
            overflow-y: auto;
        }

        .persona-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-purple));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .persona-card:hover::before {
            opacity: 1;
        }

        .persona-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 12px;
        }

        .persona-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            flex: 1;
        }

        .persona-badge {
            background: var(--bg-secondary);
            color: var(--accent-cyan);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        .persona-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
            flex: 1;
        }

        .persona-attributes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .attribute {
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .attribute-label {
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .attribute-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .flip-hint {
            position: absolute;
            bottom: 16px;
            left: 24px;
            right: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 8px;
            background: var(--bg-secondary);
            border-radius: 6px;
            opacity: 0.7;
        }

        .persona-section {
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        .cot-section {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 3px solid var(--accent-purple);
        }

        .cot-step {
            margin-bottom: 16px;
        }

        .cot-step-title {
            font-weight: 600;
            color: var(--accent-purple);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .cot-step-content {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.6;
            padding-left: 12px;
        }

        .cot-step-content ul {
            margin-top: 8px;
            padding-left: 20px;
        }

        .cot-step-content li {
            margin-bottom: 4px;
        }

        .job-to-be-done {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 3px solid var(--accent-orange);
        }

        .job-title {
            font-weight: 600;
            color: var(--accent-orange);
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .job-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .job-outcomes {
            margin-top: 12px;
        }

        .job-outcomes-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .job-outcomes-list {
            list-style: none;
            padding: 0;
        }

        .job-outcomes-list li {
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 4px 0;
            padding-left: 20px;
            position: relative;
        }

        .job-outcomes-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--accent-green);
            font-weight: bold;
        }

        .customers-list, .quotes-list {
            list-style: none;
            padding: 0;
        }

        .customers-list li, .quotes-list li {
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 6px 0;
            padding-left: 20px;
            position: relative;
            line-height: 1.5;
        }

        .customers-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent-cyan);
            font-size: 1.2rem;
        }

        .quotes-list li::before {
            content: '"';
            position: absolute;
            left: 0;
            color: var(--accent-purple);
            font-size: 1.2rem;
        }

        .customer-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .customer-contacts {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .quote-text {
            font-style: italic;
            color: var(--text-secondary);
        }

        .technical-depth {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .depth-very-high { background: rgba(255, 107, 107, 0.2); color: var(--accent-orange); }
        .depth-high { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); }
        .depth-medium-high { background: rgba(78, 205, 196, 0.2); color: var(--accent-cyan); }
        .depth-medium { background: rgba(251, 191, 36, 0.2); color: var(--accent-yellow); }
        .depth-low-medium { background: rgba(81, 207, 102, 0.2); color: var(--accent-green); }

        .stats-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }

        .stats-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 768px) {
            .personas-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .persona-attributes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        function renderPersonaCard(persona) {
            const depthClass = `depth-${persona.technicalDepth.replace('-', '-')}`;
            const customersHtml = persona.customers.map(c => 
                `<li><span class="customer-name">${c.name}</span>${c.contacts.length > 0 ? ` <span class="customer-contacts">(${c.contacts.join(', ')})</span>` : ''}</li>`
            ).join('');

            return `
                <div class="persona-card" onclick="this.classList.toggle('flipped')">
                    <div class="persona-card-inner">
                        <div class="persona-card-front">
                            <div class="persona-header">
                                <h3 class="persona-title">${persona.title}</h3>
                                <span class="persona-badge">${persona.customers.length} customers</span>
                            </div>
                            <p class="persona-description">${persona.description}</p>
                            <div class="persona-attributes">
                                <div class="attribute">
                                    <div class="attribute-label">Technical Depth</div>
                                    <div class="attribute-value"><span class="technical-depth ${depthClass}">${persona.technicalDepth}</span></div>
                                </div>
                                <div class="attribute">
                                    <div class="attribute-label">Decision Authority</div>
                                    <div class="attribute-value">${persona.decisionAuthority}</div>
                                </div>
                                <div class="attribute">

                        </div>
                        <div class="persona-card-back">

                                <div class="job-description"><strong>Core:</strong> ${persona.jobToBeDone.core}</div>
                                <div class="job-description"><strong>Context:</strong> ${persona.jobToBeDone.context}</div>
                                <div class="job-description"><strong>Motivation:</strong> ${persona.jobToBeDone.motivation}</div>
                                <div class="job-outcomes">
                                    <div class="job-outcomes-title">Desired Outcomes:</div>
                                    <ul class="job-outcomes-list">
                                        ${persona.jobToBeDone.desiredOutcome.map(o => `<li>${o}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                            <div class="cot-section">
                                <div class="section-label">CoT + ReAct Analysis</div>
                                <div class="cot-step">
                                    <div class="cot-step-title">🔍 OBSERVE</div>
                                    <div class="cot-step-content">
                                        <ul>
                                            ${persona.cotAnalysis.observe.map(o => `<li>${o}</li>`).join('')}

                                    </div>
                                </div>
                                <div class="cot-step">
                                    <div class="cot-step-title">💭 THINK</div>
                                    <div class="cot-step-content">
                                        <ul>

                                        </ul>
                                    </div>
                                </div>
                                <div class="cot-step">
                                    <div class="cot-step-title">⚡ ACT</div>

                                        <ul>
                                            ${persona.cotAnalysis.act.map(a => `<li>${a}</li>`).join('')}

                                    </div>
                                </div>
                            </div>
                            <div class="persona-section">
                                <div class="section-label">Representative Customers</div>
                                <ul class="customers-list">
                                    ${customersHtml}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render all personas
        document.getElementById('personasGrid').innerHTML = personasData.map(renderPersonaCard).join('');
