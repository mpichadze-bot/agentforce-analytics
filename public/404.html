<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0176d3" />
    <title>Agentforce Studio - Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Single Page Apps for GitHub Pages
      // This script checks if we're on a 404 page and redirects to index.html
      // while preserving query parameters and hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var pathname = l.pathname;
      
      // Only redirect if we're not already on index.html
      if (!pathname.endsWith('index.html') && !pathname.endsWith('/')) {
        var basePath = pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var redirectPath = basePath + '/index.html' + l.search + l.hash;
        window.location.replace(redirectPath);
      }
    </script>
  </body>
</html>
